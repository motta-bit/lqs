<title>LQS — El mejor amigo de tus ideas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Rubik:wght@400;500;900&family=IBM+Plex+Mono:wght@400;600&family=Newsreader:ital,wght@1,300&display=swap">
<style>
/* LQS Display: Syne con el corte de la marca, derivada bajo SIL OFL.
   Se sirve desde el propio sitio —no desde Google Fonts— porque es nuestra.
   font-display:swap deja que el titular se vea en Syne mientras llega: las
   dos tienen los mismos avances, así que el texto no salta de sitio. */
@font-face{
  font-family:'LQS Display';
  src:url('{{RAIZ}}tipos/LQS-Display.woff2') format('woff2');
  font-weight:800; font-style:normal; font-display:swap;
}
:root{
  --papel:#FDFBF7; --crema:#F5F2EC; --tinta:#1A1720; --humo:#4A4453;
  --violeta:#8B3DF0; --azul:#2563EB; --lima:#84CC16; --ambar:#F5A623; --rojo:#F0483C;
  --p-violeta:#C4A8F5; --p-azul:#A8CBF5; --p-lima:#BFE0A8; --p-ambar:#F7D9A6; --p-rojo:#F7B2AB;
  --gap:8px; --r-cont:28px; --r-bloque:20px; --r-int:14px;
  --grano-fino:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.6' numOctaves='4' stitchTiles='stitch'/></filter><rect width='90' height='90' filter='url(%23n)'/></svg>");
  --grano-tramado:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/><feComponentTransfer><feFuncR type='discrete' tableValues='0 0 0 1'/><feFuncG type='discrete' tableValues='0 0 0 1'/><feFuncB type='discrete' tableValues='0 0 0 1'/></feComponentTransfer></filter><rect width='260' height='260' filter='url(%23n)'/></svg>");
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:86px}
body{background:var(--papel);color:var(--tinta);font-family:'Rubik',system-ui,sans-serif;
  font-weight:500;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}

/* ---------- sistema ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.pared{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap)}
.seccion{padding:56px 0 8px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--humo);margin:0 0 12px}
h1,h2,h3,h4{font-family:'Syne',system-ui,sans-serif;font-weight:800;margin:0;text-wrap:balance}
/* El corte solo en H1. Es una tipografia de display: los cortes miden una
   fraccion del trazo, asi que por debajo de ~34px se empastan y la palabra
   se lee como mancha. H2 para abajo sigue en Syne limpia. */
h1{font-family:'LQS Display','Syne',system-ui,sans-serif;
  font-size:clamp(42px,8.4vw,96px);line-height:.78;letter-spacing:-.035em}
h2{font-size:clamp(28px,4.4vw,52px);line-height:.85;letter-spacing:-.03em}
h3{font-size:clamp(20px,2.4vw,30px);line-height:1;letter-spacing:-.025em}
h4{font-size:19px;line-height:1.12;letter-spacing:-.02em}
p{margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.cita{font-family:'Newsreader',serif;font-style:italic;font-weight:300;font-size:21px;line-height:1.35}
.dim{color:var(--humo)}
.grano::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.30;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='5'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.55'/></svg>")}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Rubik';font-weight:900;font-size:13px;letter-spacing:.02em;text-transform:uppercase;
  height:44px;padding:0 22px;border-radius:999px;border:2px solid var(--tinta);
  background:var(--tinta);color:var(--papel);cursor:pointer;text-decoration:none;
  box-shadow:4px 4px 0 var(--tinta);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}
.btn:focus-visible{outline:3px solid var(--violeta);outline-offset:3px}
.btn.v{background:var(--violeta);border-color:var(--violeta);color:#fff}
.btn.ghost{background:transparent;color:var(--tinta)}
.btn.sm{height:36px;padding:0 16px;font-size:12px;box-shadow:3px 3px 0 var(--tinta)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- 00 cabecera ---------- */
.top{position:fixed;inset:8px 8px auto 8px;z-index:60;max-width:1180px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 10px 10px 18px;border-radius:999px;background:transparent;
  transition:background .25s,color .25s,box-shadow .25s}
.top.pegada{background:var(--tinta);color:var(--papel);box-shadow:0 6px 24px rgba(26,23,32,.16)}
.top.pegada .nav a{color:var(--papel)}
.marca{display:flex;align-items:center;gap:10px;font-family:'Syne';font-weight:800;
  font-size:21px;letter-spacing:-.03em;color:inherit;text-decoration:none}
.marca .cara{display:block;width:34px;height:34px;flex:none}
.nav{display:flex;gap:20px;font-size:13.5px}
.nav a{color:var(--tinta);text-decoration:none;opacity:.8}
.nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.nav a[aria-current="page"]{opacity:1;font-weight:900;text-decoration:underline;text-underline-offset:5px;
  text-decoration-thickness:2px}
@media(max-width:760px){
  /* una sola fila: el gato y los tres destinos. El botón sobra — «Cotizador» ya está en el menú */
  .top{padding:8px 14px;gap:10px;background:rgba(253,251,247,.92);backdrop-filter:blur(8px)}
  .top .wordmark{display:none}
  .top > .btn.v{display:none}
  .marca .cara{width:30px;height:30px}
  .marca lqs-trazo svg{width:30px;height:30px}
  .nav{gap:14px;font-size:12.5px;margin-left:auto}
  .nav a{opacity:.72}
}
@media(max-width:380px){ .nav{gap:10px;font-size:11.5px} }

/* ---------- 00b idioma ---------- */
.idioma{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;
  color:inherit;text-decoration:none;opacity:.55;border:1.5px solid currentColor;border-radius:999px;
  padding:5px 10px;white-space:nowrap;transition:opacity .14s}
.idioma:hover{opacity:1}
.idioma b{font-weight:600}
.top.pegada .idioma{color:var(--papel)}

@media(max-width:760px){ .idioma{padding:4px 8px;font-size:10px;letter-spacing:.06em} }

/* ---------- 01 hero ---------- */
.hero{grid-column:span 6;position:relative;overflow:hidden;border-radius:var(--r-cont);
  background:linear-gradient(140deg,var(--p-violeta),var(--p-rojo));color:#1A1720;
  padding:clamp(28px,5vw,56px);min-height:min(78vh,620px);
  display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.hero h1{font-size:clamp(96px,19vw,230px);line-height:.8;letter-spacing:-.05em}
/* La S del nombre va en Syne limpia. En el hero LQS no es un titular:
   es la marca, y de las tres letras la S es la que peor aguanta el corte
   —sus dos curvas se cruzan y las vetas se juntan en el medio—. Dejarla
   entera ancla la palabra; la L y la Q llevan el corte. */
.s-limpia{font-family:'Syne',system-ui,sans-serif}
.hero .lema{font-family:'Syne',system-ui,sans-serif;font-weight:800;
  font-size:clamp(24px,4.2vw,50px);line-height:1;letter-spacing:-.03em;margin-top:clamp(10px,1.6vw,22px)}
.hero .lede{max-width:44ch;font-size:clamp(15px,1.7vw,18px)}
.hero .acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
/* Siluetas orgánicas granuladas. Las genera formas/siluetas.py sumando de
   dos a cinco lóbulos con amplitud chica —pocos lóbulos, curva suave por
   construcción— y descarta cualquiera con un giro de más de 62°, así que no
   hay puntas. Van como clipPath en objectBoundingBox: escalan con la caja.

   Tres capas de textura y ninguna toca el borde: el degradado de cuerpo, un
   tramado de puntos enmascarado en diagonal (la densidad crece hacia la
   sombra, y eso es lo que se lee como volumen) y un grano fino parejo que le
   quita el acabado de plástico. El grano vive dentro; la silueta queda dura.
   Esa es la diferencia entre granulado y disperso. */
/* multiply sobre papel; sobre campo de color, soft-light. Con multiply
   encima del degradado del hero las siluetas salían gris verdoso: el modo
   las apaga en vez de asentarlas. */
.blob{position:absolute;mix-blend-mode:multiply;isolation:isolate;pointer-events:none;
  animation:flotar var(--t,22s) ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.blob::before,.blob::after{content:"";position:absolute;inset:0}
.blob::before{background-image:var(--grano-tramado);mix-blend-mode:multiply;opacity:.46;
  -webkit-mask-image:linear-gradient(145deg,transparent 6%,#000 82%);
  mask-image:linear-gradient(145deg,transparent 6%,#000 82%)}
.blob::after{background-image:var(--grano-fino);mix-blend-mode:overlay;opacity:.46}
.hero .blob,.pared[style] .blob{mix-blend-mode:soft-light}
/* Las que se desvanecen se disuelven EN GRANO: la máscara adelgaza el
   tramado antes de apagarlo, en vez de volver la forma translúcida. */
.blob.humo{-webkit-mask-image:linear-gradient(var(--a,155deg),#000 18%,rgba(0,0,0,.2) 68%,transparent 94%);
  mask-image:linear-gradient(var(--a,155deg),#000 18%,rgba(0,0,0,.2) 68%,transparent 94%)}
@keyframes flotar{
  0%{transform:translate(0,0) rotate(0deg) scale(1)}
  50%{transform:translate(calc(var(--x,10px)*.6),var(--y,-8px)) rotate(var(--r,3deg)) scale(1.03)}
  100%{transform:translate(var(--x,10px),calc(var(--y,-8px)*.3)) rotate(calc(var(--r,3deg)*-.7)) scale(.99)}
}
.h-forma{position:absolute;right:-64px;top:-70px;width:min(260px,42vw);height:min(230px,38vw);
  background:linear-gradient(140deg,var(--p-ambar),var(--p-violeta));
  clip-path:url(#sil1);--t:24s;--x:-14px;--y:9px;--r:4deg}
.h-forma2{position:absolute;right:9%;bottom:6%;width:clamp(96px,11vw,150px);height:clamp(84px,9.6vw,132px);
  background:linear-gradient(200deg,var(--p-azul),var(--p-lima));
  clip-path:url(#sil7);--t:19s;--d:-7s;--x:11px;--y:-13px;--r:-5deg}
.h-forma3{position:absolute;left:-40px;bottom:-30px;width:clamp(80px,9vw,124px);height:clamp(70px,8vw,108px);
  background:linear-gradient(20deg,var(--p-rojo),var(--p-ambar));
  clip-path:url(#sil5);--t:27s;--d:-12s;--x:9px;--y:12px;--r:3deg;--a:165deg}

/* entrada: los bloques se arman. Sin JS o con reduced-motion ya están armados. */
.arma .apila{animation:apila .72s cubic-bezier(.2,.9,.25,1) both}
.arma .apila:nth-child(2){animation-delay:.07s}
.arma .apila:nth-child(3){animation-delay:.14s}
.arma .apila:nth-child(4){animation-delay:.2s}
@keyframes apila{from{opacity:0;transform:translateY(26px) rotate(-1.4deg) scale(.97)}
  to{opacity:1;transform:none}}

/* ---------- 02 problema ---------- */
.p-suelto{grid-column:span 3;background:var(--crema);border-radius:var(--r-bloque);
  padding:26px;display:flex;flex-direction:column;gap:18px;min-height:230px}
.p-junto{grid-column:span 3;background:var(--tinta);color:var(--papel);border-radius:var(--r-bloque);
  padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:16px;min-height:230px;position:relative;overflow:hidden}
.sueltas{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1}
.forma{width:44px;height:44px;flex:none}
.sueltas .forma:nth-child(1){transform:rotate(-14deg)}
.sueltas .forma:nth-child(3){transform:rotate(22deg)}
.sueltas .forma:nth-child(5){transform:rotate(-8deg)}
.juntas{display:grid;grid-template-columns:repeat(3,44px);gap:2px}

/* ---------- encabezado de página ---------- */
.pagina-encab{padding-top:104px;padding-bottom:0}
.tit-pagina{font-family:'LQS Display','Syne',system-ui,sans-serif;font-weight:800;margin:0;
  font-size:clamp(40px,6vw,68px);line-height:.92;letter-spacing:-.03em;text-wrap:balance}
.bajada{max-width:58ch;margin-top:14px;font-size:clamp(15px,1.7vw,17px)}

/* ---------- rutas del inicio ---------- */
/* Tres reglas del sistema que estas tarjetas no cumplían:
   «Pastel nunca directo sobre Papel: borde en Tinta o fondo Crema» — iban sin
   borde. «Grano de granito en cada superficie de color» — no lo llevaban. Y
   usaban --r-cont (28), que es el radio del CONTENEDOR; dentro de una pared
   va --r-bloque (20), y por eso se veían blandas. */
.ruta{grid-column:span 2;background:var(--sf,var(--crema));
  border:2px solid var(--tinta);border-radius:var(--r-bloque);
  padding:24px;min-height:210px;display:flex;flex-direction:column;gap:10px;
  color:var(--tinta);text-decoration:none;position:relative;overflow:hidden;
  isolation:isolate;transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s cubic-bezier(.4,0,.2,1)}
.ruta::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--grano-fino);opacity:.22;mix-blend-mode:multiply}
/* Sombra DURA, del color del borde. Una difusa sobre pastel se ve sucia;
   esta se lee como papel levantado — y solo funciona porque hay borde. */
.ruta:hover{transform:translateY(-3px);box-shadow:4px 4px 0 var(--tinta)}
.ruta-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
/* El monograma dibujándose, arriba del LQS del hero. Se le deja aire abajo
   porque el h1 tiene line-height .78 y sin esto se le monta encima. */
.h-marca{margin:0 0 14px;line-height:0}
.h-marca lqs-trazo{display:block}
/* Respaldo del logo. <lqs-trazo> se pinta por JavaScript: si el script no
   llega —red caída, JS desactivado, un navegador sin custom elements— el
   elemento se queda con altura cero y el hero sale SIN LOGO. Medido: 0 px
   de alto y 0 de contenido.
   Dentro del elemento va el logo completo como <img>. Cuando el componente
   arranca lo reemplaza, así que normalmente no se ve; el retraso de 1,5 s
   evita que asome y se redibuje cuando el script simplemente va lento. */
lqs-trazo>img{display:block;opacity:0;animation:trazo-respaldo 0s linear 1.5s forwards}
lqs-trazo:defined>img{display:none}
@keyframes trazo-respaldo{to{opacity:1}}
/* OJO con el nombre: `.ficha` ya existe en el sitio — es la tarjeta de la
   galería de muestras, con fondo papel y span 2. Llamar a esto igual hacía
   que la regla de allá ganara y el ícono saliera como un bloque blanco. */
.ruta-ficha{width:38px;height:38px;border-radius:var(--r-int);background:var(--tinta);
  color:var(--papel);display:grid;place-items:center;flex:none}
.ruta-ficha svg{width:19px;height:19px;display:block}
.ruta-ir span{display:inline-block;transition:transform .18s}
.ruta:hover .ruta-ir span{transform:translateX(4px)}
.ruta:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--tinta)}
.ruta:focus-visible{outline:3px solid var(--violeta);outline-offset:3px}
.ruta-n{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  letter-spacing:.2em;opacity:.55}
.ruta p{font-size:13.5px;color:#3A3346}
.ruta-ir{margin-top:auto;font-family:'Rubik';font-weight:900;font-size:12.5px;
  letter-spacing:.02em;text-transform:uppercase}

/* ---------- barra de selección ---------- */
.barra-sel{position:sticky;bottom:12px;z-index:40;margin-top:20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--tinta);color:var(--papel);border-radius:999px;padding:12px 12px 12px 24px;
  box-shadow:0 8px 30px rgba(26,23,32,.28)}
.barra-sel[hidden]{display:none}
.barra-sel b{font-family:'Syne';font-weight:800;font-size:16px;display:block}
.barra-sel .mono{font-size:11px;opacity:.7;display:block}
.barra-acc{display:flex;gap:8px;flex-wrap:wrap}
.barra-sel .btn.ghost{color:var(--papel);border-color:var(--papel);box-shadow:3px 3px 0 var(--papel)}
@media(max-width:560px){
  .barra-sel{border-radius:var(--r-bloque);padding:14px 16px}
  .barra-acc{width:100%}
  .barra-acc .btn{flex:1}
}

/* ---------- acciones del formulario ---------- */
.form-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn.ghost.claro{background:transparent;color:var(--papel);border-color:var(--papel);
  box-shadow:4px 4px 0 var(--papel)}
.btn.ghost.claro:hover{background:rgba(253,251,247,.14)}

/* ---------- quiénes somos ---------- */
.nos-grande{grid-column:span 4;background:var(--crema);border-radius:var(--r-cont);
  padding:clamp(26px,3.6vw,40px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.nos-grande h2{font-size:clamp(26px,3.6vw,46px);line-height:.98}
.nos-grande h2 em{font-style:normal;color:var(--violeta)}
.nos-lugar{grid-column:span 2;background:var(--tinta);color:var(--papel);
  border-radius:var(--r-cont);padding:clamp(24px,3vw,32px);position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:12px}
.nos-lugar h3{font-size:clamp(22px,2.6vw,32px)}
.nos-forma{position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;
  border-radius:50%;background:var(--p-lima);opacity:.22}
.nos-bloque{grid-column:span 3;background:var(--sf,var(--crema));border-radius:var(--r-bloque);
  padding:26px;display:flex;flex-direction:column;gap:10px}
.nos-bloque h4{font-size:20px}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--gap)}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;height:32px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:2px solid var(--tinta);background:transparent;color:var(--tinta);transition:.14s}
.chip[aria-pressed="true"]{background:var(--violeta);border-color:var(--violeta);color:#fff}
.chip:focus-visible{outline:3px solid var(--violeta);outline-offset:3px}

/* ---------- 03 módulos ---------- */
.mod{grid-column:span 2;background:var(--sf,var(--crema));border-radius:var(--r-bloque);
  color:var(--tinta);display:flex;flex-direction:column;position:relative;align-self:start;
  transition:transform .14s,box-shadow .14s,opacity .2s}
.mod:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--tinta)}
.mod.oculto{display:none}
.mod.elegida{box-shadow:0 0 0 3px var(--tinta)}
.mod.elegida:hover{box-shadow:0 0 0 3px var(--tinta),0 6px 0 var(--tinta)}

.mod-cab{padding:22px 22px 14px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.mod-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-right:34px}
.ico{width:36px;height:36px;color:var(--tinta);flex:none;display:block}
.mod-name{font-family:'Syne';font-weight:800;font-size:21px;letter-spacing:-.02em;margin-top:10px}
.mod-desc{font-size:13px;color:#3A3346;line-height:1.4}
.mod-price{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  margin-top:auto;letter-spacing:.02em;padding-top:10px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;background:var(--tinta);color:var(--papel);padding:4px 9px;
  border-radius:999px;white-space:nowrap;flex:0 0 auto;margin-top:5px}
.check{position:absolute;top:15px;right:15px;width:26px;height:26px;border-radius:999px;
  background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-size:13px;
  opacity:0;transform:scale(.5);transition:.16s;pointer-events:none}
.mod.elegida .check{opacity:1;transform:scale(1)}
.mod.llena .check{background:var(--violeta)}

/* el desplegable: lo que se puede pedir dentro de cada área */
.mod-abrir{margin:0 14px 14px;border:2px solid var(--tinta);background:transparent;color:var(--tinta);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;border-radius:var(--r-int);padding:9px 12px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.14s}
.mod-abrir:hover{background:var(--tinta);color:var(--papel)}
.mod-abrir:focus-visible{outline:3px solid var(--violeta);outline-offset:2px}
.mod-flecha{font-size:15px;line-height:1;transition:transform .2s}
.mod-abrir[aria-expanded="true"] .mod-flecha{transform:rotate(45deg)}
.mod-lista{display:flex;flex-direction:column;gap:5px;padding:0 14px 14px}
.mod-lista[hidden]{display:none}
.serv{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;font:inherit;
  font-size:13px;line-height:1.35;color:var(--tinta);background:rgba(253,251,247,.6);border:0;
  cursor:pointer;border-radius:var(--r-int);padding:9px 11px;transition:.13s}
.serv-txt{flex:1;min-width:0}
.serv-u{display:block;font-style:normal;font-size:10.5px;opacity:.6;margin-top:1px}
.serv-p{font-size:11px;font-weight:600;white-space:nowrap;flex:0 0 auto;margin-top:1px}
.serv-todo{width:100%;margin-top:4px;border:2px dashed var(--tinta);background:transparent;
  color:var(--tinta);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-int);padding:10px;
  cursor:pointer;transition:.14s}
.serv-todo:hover{background:var(--tinta);color:var(--papel)}
.serv-todo:focus-visible{outline:3px solid var(--violeta);outline-offset:2px}

/* ---------- 14 galería ---------- */
.gal-barra{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.buscador{display:flex;align-items:center;gap:10px;background:var(--crema);
  border:2px solid var(--tinta);border-radius:999px;padding:0 18px;height:52px}
.buscador:focus-within{outline:3px solid var(--violeta);outline-offset:2px}
.busca-ico{font-size:21px;opacity:.5;flex:none;line-height:1}
#busca{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;
  color:var(--tinta);outline:none;height:100%}
#busca::-webkit-search-cancel-button{display:none}
.busca-x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;
  color:var(--humo);padding:0 4px}
.gal-cuenta{font-size:11.5px;color:var(--humo);margin-bottom:12px;min-height:16px}
.ficha{grid-column:span 2;background:var(--papel);border:2px solid var(--tinta);
  border-radius:var(--r-bloque);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .14s,box-shadow .14s}
.ficha:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--tinta)}
.ficha-vis{background:var(--sf,var(--crema));aspect-ratio:4/3;display:grid;place-items:center;
  position:relative}
.ficha-vis .ico{width:52px;height:52px;opacity:.55}
.ficha-falta{position:absolute;bottom:10px;left:10px;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.45}
.ficha-txt{padding:16px 18px 18px;display:flex;flex-direction:column;gap:5px;flex:1}
.ficha-area{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--humo)}
.ficha-txt h3{font-size:17px;line-height:1.15;letter-spacing:-.02em}
.ficha-u{font-size:11.5px}
.ficha-p{font-size:12px;font-weight:600;margin-top:auto;padding-top:8px}
.ficha-ir{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tinta);text-decoration:none;
  border-top:1px solid rgba(26,23,32,.14);padding-top:10px;margin-top:8px}
.ficha-ir:hover{text-decoration:underline;text-underline-offset:3px}
.gal-nada{grid-column:span 6;background:var(--crema);border-radius:var(--r-bloque);
  padding:40px 26px;text-align:center}
.gal-nada p{max-width:46ch;margin:8px auto 18px}
.serv:hover{background:rgba(253,251,247,.98)}
.serv.bloqueado{opacity:.42}
.serv.bloqueado .serv-txt{text-decoration:line-through;text-decoration-thickness:1px}
.serv:focus-visible{outline:3px solid var(--violeta);outline-offset:2px}
.serv-tick{width:17px;height:17px;border-radius:999px;border:2px solid var(--humo);flex:none;
  display:grid;place-items:center;font-size:10px;color:transparent;margin-top:1px;transition:.13s}
.serv[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.serv[aria-pressed="true"] .serv-tick{background:var(--papel);border-color:var(--papel);color:var(--tinta)}

.mod-mas{grid-column:span 4;background:var(--crema);border:2px dashed var(--humo);
  border-radius:var(--r-bloque);padding:22px;display:flex;flex-direction:column;
  align-items:flex-start;gap:8px;justify-content:center}
.mod-mas .mod-desc{max-width:52ch}
.mod-mas .btn{margin-top:6px}

.apertura{grid-column:span 2;background:var(--crema);border:2px dashed var(--humo);
  border-radius:var(--r-bloque);padding:22px;min-height:120px;
  display:flex;flex-direction:column;gap:5px}
.apertura .mod-price{color:var(--humo)}

/* ---------- 03b express ---------- */
.ex{grid-column:span 6;background:var(--tinta);color:var(--papel);border-radius:var(--r-cont);
  padding:30px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.ex-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  width:100%;flex-wrap:wrap}
.ex-tit{font-family:'Syne';font-weight:800;font-size:clamp(30px,4.4vw,46px);letter-spacing:-.03em;
  line-height:.95;display:flex;align-items:center;gap:14px}
.ex-reloj{width:clamp(34px,4.4vw,46px);height:clamp(34px,4.4vw,46px);flex:none;
  color:var(--papel);display:block}
.ex-sello{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  border:2px solid var(--papel);border-radius:999px;padding:6px 13px;opacity:.85;white-space:nowrap}
.ex-bajada{font-size:15px;line-height:1.5;opacity:.82;max-width:58ch}
.ex-lista{display:flex;flex-wrap:wrap;gap:8px}
.ex-item{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.02em;
  background:rgba(253,251,247,.12);border-radius:999px;padding:9px 16px}

/* ---------- 12 documentos legales ---------- */
.doc-ind{grid-column:span 6;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;
  background:var(--crema);border-radius:var(--r-bloque);padding:16px 22px;
  position:sticky;top:70px;z-index:20}
.doc-ind a{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tinta);text-decoration:none;opacity:.75}
.doc-ind a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.doc-fecha{font-size:11px;color:var(--humo);margin-left:auto}
.doc{max-width:74ch;scroll-margin-top:150px}
.doc h2{margin-bottom:18px}
.doc h3{font-size:clamp(18px,2vw,23px);margin:30px 0 8px;letter-spacing:-.02em}
.doc p{margin-bottom:12px;font-size:15.5px;line-height:1.68;overflow-wrap:break-word}
.doc ul{margin:0 0 14px;padding-left:20px}
.doc li{margin-bottom:8px;font-size:15.5px;line-height:1.6;overflow-wrap:break-word}
.doc a{color:var(--tinta);text-underline-offset:3px;overflow-wrap:anywhere}
.doc-clave{background:var(--p-ambar);border-radius:var(--r-int);padding:16px 18px;margin-bottom:14px}
.doc-nota{font-size:13.5px;color:var(--humo);border-left:3px solid var(--humo);
  padding-left:14px;line-height:1.55}
.falta{background:var(--rojo);color:var(--papel);padding:2px 8px;border-radius:6px;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600}
.doc-cierre{grid-column:span 6;background:var(--tinta);color:var(--papel);
  border-radius:var(--r-cont);padding:clamp(24px,4vw,40px)}
.doc-cierre p{max-width:58ch;opacity:.85;margin-top:8px}

/* ---------- 13 error ---------- */
.err{grid-column:span 6;position:relative;overflow:hidden;border-radius:var(--r-cont);
  background:linear-gradient(140deg,var(--p-azul),var(--p-violeta));color:var(--tinta);
  padding:clamp(28px,5vw,60px);min-height:min(62vh,500px);
  display:flex;flex-direction:column;justify-content:center;gap:10px}
.err-cara{width:clamp(66px,9vw,96px);aspect-ratio:1;display:block;color:var(--tinta);margin-bottom:8px}
.err-cod{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.65}
.err-tit{font-family:'LQS Display','Syne',system-ui,sans-serif;font-weight:800;
  font-size:clamp(40px,8vw,88px);line-height:.86;letter-spacing:-.035em}
.err-txt{max-width:46ch;font-size:clamp(15px,1.7vw,18px);margin-top:6px}
.err .acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* ---------- 15 descuentos ---------- */
.desc-caja{grid-column:span 3;background:var(--crema);border-radius:var(--r-cont);padding:26px}
.desc-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.desc-cab h3{font-size:clamp(20px,2.4vw,26px)}
.desc-tope{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:var(--tinta);color:var(--papel);padding:5px 11px;border-radius:999px;white-space:nowrap}
.escalera{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.esc-fila{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-int);
  transition:background .16s}
.esc-fila.logrado{background:rgba(26,23,32,.05)}
.esc-fila.aqui{background:var(--tinta);color:var(--papel)}
.esc-n{font-size:11.5px;font-weight:600;width:64px;flex:none}
.esc-barra{flex:1;height:7px;background:rgba(26,23,32,.12);border-radius:99px;overflow:hidden}
.esc-fila.aqui .esc-barra{background:rgba(253,251,247,.22)}
.esc-barra i{display:block;height:100%;background:var(--violeta);border-radius:99px}
.esc-p{font-size:12.5px;font-weight:600;width:44px;text-align:right;flex:none}

.planes{display:flex;flex-direction:column;gap:9px}
.plan{position:relative;background:var(--papel);border:2px solid var(--tinta);
  border-radius:var(--r-bloque);padding:15px 16px}
.plan.rec{border-color:var(--violeta)}
.plan.activo{background:var(--p-lima)}
.plan-sello{position:absolute;top:-9px;left:14px;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;background:var(--violeta);color:#fff;padding:3px 9px;border-radius:999px}
.plan-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.plan-cab h4{font-size:17px}
.plan-cab b{font-size:14px}
.plan-d{font-size:12.5px;margin-top:2px}
.plan-areas{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.plan-a{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;background:var(--crema);border-radius:999px;padding:4px 9px}
.plan.activo .plan-a{background:rgba(26,23,32,.09)}
.plan-ir{width:100%;margin-top:12px;border:2px solid var(--tinta);background:transparent;
  color:var(--tinta);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-int);padding:9px;
  cursor:pointer;transition:.14s}
.plan-ir:hover{background:var(--tinta);color:var(--papel)}
.plan-ir:focus-visible{outline:3px solid var(--violeta);outline-offset:2px}

/* ---------- 16 asesoría ---------- */
.ases{grid-column:span 6;background:var(--tinta);color:var(--papel);border-radius:var(--r-cont);
  padding:clamp(28px,4.5vw,50px);display:flex;align-items:center;gap:34px}
.ases-txt{flex:1;min-width:0}
.ases-tit{font-family:'Syne';font-weight:800;font-size:clamp(28px,4.4vw,46px);letter-spacing:-.03em;
  line-height:.98;margin-bottom:16px;text-wrap:balance}
.ases-p{max-width:58ch;opacity:.85;margin-bottom:10px;font-size:clamp(14.5px,1.6vw,16.5px)}
.ases-p b{opacity:1}
.ases-acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn.claro{background:var(--papel);border-color:var(--papel);color:var(--tinta);
  box-shadow:4px 4px 0 rgba(253,251,247,.3)}
.ases-cara{width:clamp(90px,11vw,132px);aspect-ratio:1;flex:none;display:block;color:var(--papel)}
@media(max-width:760px){ .ases{flex-direction:column-reverse;align-items:flex-start;gap:20px} }
.cot-cara{width:56px;aspect-ratio:1;flex:none;display:block;color:var(--papel);margin-bottom:4px}
.form-ancho,.faqs-ancho{grid-column:span 6}

/* ---------- 04 ecosistema ---------- */
.eco{grid-column:span 6;background:var(--crema);border-radius:var(--r-cont);padding:22px}
.eco-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;
  flex-wrap:wrap;margin-bottom:18px}
.pared-eco{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap);min-height:130px;
  border-radius:var(--r-bloque);padding:10px;position:relative;overflow:hidden;
  transition:background .35s}
.pared-eco.conectada{background:linear-gradient(125deg,var(--p-violeta),var(--p-azul))}
.eco-memphis{position:absolute;width:112px;height:112px;border-radius:50%;background:var(--ambar);
  opacity:0;pointer-events:none;transition:opacity .45s;z-index:2;mix-blend-mode:multiply;
  left:calc(33.3% - 56px);top:-34px}
.pared-eco.conectada .eco-memphis{opacity:.42}
.eco-chip{grid-column:span 2;background:var(--papel);border:2px solid var(--tinta);
  border-radius:var(--r-int);padding:14px;display:flex;flex-direction:column;gap:4px;
  position:relative;z-index:1;animation:entra .22s ease-out}
.pared-eco.conectada .eco-chip{background:rgba(253,251,247,.84);border-color:transparent}
@keyframes entra{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.eco-vacio[hidden]{display:none!important}
.eco-vacio{grid-column:span 6;display:grid;place-items:center;color:var(--humo);
  font-size:13.5px;padding:30px 0;text-align:center}
.datos{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.dato{background:var(--tinta);color:var(--papel);border-radius:var(--r-int);
  padding:12px 16px;min-width:136px}
.dato b{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}
.dato span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;opacity:.72}
.dato.ok{background:var(--lima);color:var(--tinta)}
.razon{font-size:13.5px;color:var(--humo);flex:1;min-width:230px}
.aviso{grid-column:span 6;background:var(--p-ambar);color:var(--tinta);
  border-radius:var(--r-bloque);padding:16px 20px;font-size:13.5px;margin-top:var(--gap)}
.aviso[hidden]{display:none}

/* ---------- 05 antes / después ---------- */
.ad{grid-column:span 6;border-radius:var(--r-cont);overflow:hidden;position:relative;
  aspect-ratio:16/8;background:var(--crema);touch-action:none;cursor:ew-resize;user-select:none}
.ad-panel{position:absolute;inset:0;display:flex;align-items:center;padding:24px}
.ad-antes{background:var(--crema);justify-content:flex-start;padding-left:clamp(20px,6%,64px)}
.ad-despues{background:linear-gradient(125deg,var(--p-violeta),var(--p-azul));
  clip-path:inset(0 0 0 50%);justify-content:flex-end;padding-right:clamp(20px,6%,64px);text-align:right}
.ad-tag{position:absolute;top:16px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  font-weight:600;letter-spacing:.18em;text-transform:uppercase;background:var(--tinta);
  color:var(--papel);padding:5px 12px;border-radius:999px}
.ad-antes .ad-tag{left:16px}
.ad-despues .ad-tag{right:16px}
.ad-manija{position:absolute;top:0;bottom:0;width:4px;background:var(--tinta);left:50%;
  transform:translateX(-50%);z-index:3;pointer-events:none}
.ad-manija::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;
  border-radius:999px;background:var(--papel);border:3px solid var(--tinta);
  transform:translate(-50%,-50%)}
.ad-manija::before{content:"";position:absolute;top:50%;left:50%;width:20px;height:10px;
  transform:translate(-50%,-50%);z-index:1;
  background:
    linear-gradient(var(--tinta),var(--tinta)) left center/3px 10px no-repeat,
    linear-gradient(var(--tinta),var(--tinta)) right center/3px 10px no-repeat}
.ad-hueco{max-width:min(34ch,40%)}
.ad-hueco .mono{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  display:block;margin-top:8px;opacity:.7}

/* ---------- 06 casos ---------- */
.caso{grid-column:span 6;background:var(--crema);border-radius:var(--r-cont);padding:0;
  overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr}
.caso-vis{background:linear-gradient(135deg,var(--p-lima),var(--p-azul));position:relative;
  overflow:hidden;min-height:330px;display:grid;place-items:center;padding:26px}
.caso-txt{padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:14px}
.caso-mods{display:flex;gap:6px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  background:var(--tinta);color:var(--papel);padding:5px 11px;border-radius:999px}
.mchip .ico{width:14px;height:14px;color:var(--papel)}
.caso-dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:4px}
.caso-dl div{background:var(--papel);border-radius:var(--r-int);padding:12px 14px}
.caso-dl b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600}
.caso-dl span{font-size:11px;color:var(--humo);line-height:1.25;display:block;margin-top:2px}
.caso-hueco{grid-column:span 3;border:2px dashed var(--humo);border-radius:var(--r-bloque);
  padding:24px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px;
  color:var(--humo)}
@media(max-width:860px){.caso{grid-template-columns:1fr}}

/* ---------- 07 cómo trabajamos ---------- */
.promesa{grid-column:span 6;background:var(--tinta);color:var(--papel);
  border-radius:var(--r-cont);padding:clamp(26px,4vw,44px)}
.promesa .cita{color:var(--p-lima);max-width:22ch;font-size:clamp(24px,3.4vw,38px);
  font-style:normal;font-family:'Syne';font-weight:800;line-height:.95;letter-spacing:-.03em}
.trato{grid-column:span 2;background:var(--crema);border-radius:var(--r-bloque);padding:22px;
  display:flex;flex-direction:column;gap:6px;min-height:132px}
.trato b{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;line-height:1}
.trato span{font-size:13px;color:var(--humo)}

/* ---------- 08 tarifas ---------- */
.tabla-caja{grid-column:span 6;background:var(--crema);border-radius:var(--r-cont);
  padding:22px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--humo);
  padding:0 12px 10px;border-bottom:2px solid rgba(26,23,32,.14)}
td{padding:13px 12px;border-bottom:1px solid rgba(26,23,32,.09);vertical-align:top}
tr:last-child td{border-bottom:0}
td.cifra{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap;text-align:right}
td b{font-family:'Syne';font-weight:800;font-size:16px}
.tarifa-nota{grid-column:span 6;font-size:13px;color:#3A3346;padding:6px 6px 0;line-height:1.6}

/* ---------- 09 cotizador ---------- */
.cot-det{display:block;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  line-height:1.6;opacity:.8}
.cot-det a{color:inherit}
.cot{grid-column:span 6;background:var(--tinta);color:var(--papel);
  border-radius:var(--r-cont);padding:clamp(22px,3.4vw,34px)}
.paso{border-top:1px solid rgba(253,251,247,.14);padding:22px 0}
.paso:first-of-type{border-top:0;padding-top:8px}
.paso-n{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;opacity:.55;margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.seg button{font-family:'Rubik';font-weight:900;font-size:12px;letter-spacing:.02em;
  text-transform:uppercase;height:38px;padding:0 18px;border-radius:999px;cursor:pointer;
  border:2px solid var(--papel);background:transparent;color:var(--papel);transition:.14s}
.seg button[aria-pressed="true"]{background:var(--papel);color:var(--tinta)}
.seg button:focus-visible{outline:3px solid var(--p-violeta);outline-offset:3px}
.urg{display:flex;align-items:center;gap:18px;margin-top:14px;flex-wrap:wrap}
.urg .cara{width:62px;aspect-ratio:1;flex:none;color:var(--papel)}
input[type=range]{flex:1;min-width:180px;accent-color:var(--p-violeta);height:30px}
.urg-val{font-family:'IBM Plex Mono',monospace;font-size:15px;min-width:132px;text-align:right}
.cot-total{display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  background:rgba(253,251,247,.07);border-radius:var(--r-bloque);padding:18px;margin-top:8px}
.cot-total .dato{background:var(--papel);color:var(--tinta)}
.cot-cierre{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.cot-cierre .btn{background:var(--lima);border-color:var(--lima);color:var(--tinta);
  box-shadow:4px 4px 0 var(--papel)}
.cot-cierre .btn.ghost{background:transparent;color:var(--papel);border-color:var(--papel)}

/* ---------- 10 contacto ---------- */
.form{grid-column:span 3;background:var(--crema);border-radius:var(--r-cont);padding:26px;
  display:flex;flex-direction:column;gap:12px}
label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--humo);display:block;margin-bottom:6px}
input[type=text],input[type=email],textarea,select{width:100%;font:inherit;font-size:14px;
  padding:12px 14px;border-radius:var(--r-int);border:2px solid rgba(26,23,32,.18);
  background:var(--papel);color:var(--tinta)}
input:focus,textarea:focus,select:focus{outline:3px solid var(--violeta);outline-offset:1px;border-color:transparent}
textarea{min-height:104px;resize:vertical}
.legal{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--humo)}
.legal input{margin-top:3px;accent-color:var(--violeta);width:16px;height:16px;flex:none}
.faqs{grid-column:span 3;display:flex;flex-direction:column;gap:var(--gap)}
details{background:var(--crema);border-radius:var(--r-bloque);padding:16px 20px}
details[open]{background:var(--papel);box-shadow:0 0 0 2px var(--tinta)}
summary{cursor:pointer;font-family:'Syne';font-weight:800;font-size:16px;letter-spacing:-.015em;
  list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:'IBM Plex Mono',monospace;font-size:19px;flex:none}
details[open] summary::after{content:"−"}
details p{margin-top:10px;font-size:13.5px;color:var(--humo)}

/* ---------- 11 pie ---------- */
footer{background:var(--tinta);color:var(--papel);margin-top:64px;padding:52px 0 32px}
.pie-grid{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:26px}
.pie-grid h5{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;opacity:.55;margin:0 0 12px}
.pie-grid a,.pie-grid p{color:var(--papel);text-decoration:none;opacity:.85;
  font-size:13.5px;display:block;margin-bottom:7px;overflow-wrap:anywhere}
.pie-grid a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
/* el correo es largo y sin puntos de corte: que quepa en vez de partirse a mitad de palabra */
.pie-grid a[href^="mailto"]{font-size:12.5px;letter-spacing:-.01em}
.pie-base{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:40px;padding-top:20px;border-top:1px solid rgba(253,251,247,.16);
  font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.6}
@media(max-width:820px){.pie-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.pie-grid{grid-template-columns:1fr;gap:22px}}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .pared{grid-template-columns:repeat(2,1fr)}
  .hero,.eco,.ad,.caso,.promesa,.cot,.tabla-caja,.aviso,.eco-vacio,.tarifa-nota,
  .p-suelto,.p-junto,.form,.faqs,.nos-grande,.nos-lugar,.nos-bloque,.ruta{grid-column:span 2}
  .mod,.apertura{grid-column:span 1}
  .mod-mas,.ex,.doc-ind,.doc-cierre,.err,.gal-nada,.desc-caja,.ases,.form-ancho,.faqs-ancho{grid-column:span 2}
  .ficha{grid-column:span 1}
  .doc-ind{position:static}
  .trato{grid-column:span 1}
  .caso-hueco{grid-column:span 1}
  .pared-eco{grid-template-columns:repeat(2,1fr)}
  .eco-chip{grid-column:span 1}
  .ad{aspect-ratio:4/3}
}
@media(max-width:560px){
  .pared{grid-template-columns:1fr}
  .hero,.eco,.ad,.caso,.promesa,.cot,.tabla-caja,.aviso,.eco-vacio,.tarifa-nota,
  .p-suelto,.p-junto,.form,.faqs,.mod,.apertura,.mod-mas,.ex,.doc-ind,.doc-cierre,.err,
  .ficha,.gal-nada,.desc-caja,.ases,.form-ancho,.faqs-ancho,
  .trato,.caso-hueco,.eco-chip,
  .nos-grande,.nos-lugar,.nos-bloque,.ruta{grid-column:span 1}
  .ex{padding:24px 20px}
  .pared-eco{grid-template-columns:1fr}
  .seccion{padding:40px 0 8px}
  .pagina-encab{padding-top:88px}
  h1{line-height:.88}
  .h-forma{width:190px;height:168px;right:-56px;top:-58px}
  .h-forma2,.h-forma3{display:none}
  .dato{flex:1 1 130px;min-width:0}
  .hero{min-height:0;gap:22px}
  .caso-vis{min-height:220px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}
