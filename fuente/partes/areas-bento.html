<!-- ============ BENTO DE ÁREAS (color) ============ -->
<section class="seccion" id="areas-bento">
  <div class="eyebrow">Ocho frentes · uno o todos</div>
  <h2 style="margin-bottom:6px">Lo que podemos hacer por tus ideas</h2>
  <p class="dim" style="margin:0 0 20px;max-width:58ch">Toma el frente que necesitas hoy y suma los demás cuando tenga
    sentido. Cada uno funciona solo y encaja con los otros.</p>
  {{AREABENTO}}
  <script>
  (function () {
    var rej = document.querySelector('#areas-bento .ab-rej');
    if (!rej) return;
    var lento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (lento || !('IntersectionObserver' in window)) { rej.classList.add('ab-entra'); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { rej.classList.add('ab-entra'); io.disconnect(); } });
    }, { threshold: 0.15 });
    io.observe(rej);
  })();
  </script>
</section>
