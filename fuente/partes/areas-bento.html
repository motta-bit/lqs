<!-- ============ BENTO DE ÁREAS (color) ============ -->
<section class="seccion" id="areas-bento">
  <div class="eyebrow">Ocho frentes · uno o todos</div>
  <h2 style="margin-bottom:6px">Lo que podemos hacer por tus ideas</h2>
  <p class="dim" style="margin:0 0 20px;max-width:58ch">Toma el frente que necesitas hoy y suma los demás cuando tenga
    sentido. Cada uno funciona solo y encaja con los otros.</p>
  {{AREABENTO}}
  <script>
  /* Cada cubo aparece al entrar en pantalla, no todos de golpe, con un escalón suave. */
  (function () {
    var rej = document.querySelector('#areas-bento .ab-rej');
    if (!rej) return;
    var tiles = [].slice.call(rej.querySelectorAll('.ab-tile'));
    var lento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (lento || !('IntersectionObserver' in window)) {
      tiles.forEach(function (t) { t.classList.add('ab-visto'); }); return;
    }
    var io = new IntersectionObserver(function (es) {
      var k = 0;
      es.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.style.animationDelay = (k++ * 60) + 'ms';
          e.target.classList.add('ab-visto');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.2, rootMargin: '0px 0px -6% 0px' });
    tiles.forEach(function (t) { io.observe(t); });
  })();
  </script>
</section>
