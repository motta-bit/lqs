<!-- ============ EXPLORA POR ÁREA ============ -->
<section class="seccion" id="areas-explora">
  {{AREAS}}

  <!-- Datos de cada cuadro para la ventana flotante. Es JSON, no se pinta. -->
  <script type="application/json" id="fichas-data">{{FICHAS}}</script>

  <!-- Ventana flotante: crece desde el cuadro que la abrió (estilo bento). -->
  <dialog class="mstra-dlg" id="mstra-dlg" aria-label="Detalle de la muestra" data-wa="{{WHATSAPP}}">
    <div class="mstra-caja">
      <button class="mstra-x" type="button" aria-label="Cerrar">&times;</button>
      <div class="mstra-media">
        <img class="mstra-media-img" alt="" hidden>
        <span class="mstra-media-nota">Muestra en camino</span>
        <a class="mstra-media-ver" target="_blank" rel="noopener" hidden>Ver en vivo →</a>
      </div>
      <div class="mstra-info">
        <span class="mstra-chip"><span class="mstra-chip-ico ico" aria-hidden="true"></span><span data-campo="area"></span></span>
        <h3 data-campo="n"></h3>
        <p class="mstra-que" data-campo="que"></p>
        <div class="mstra-precio-bloque">
          <span class="mstra-tag" data-campo="tag"></span>
          <div class="mstra-precio-fila"><span class="mstra-pnum" data-campo="pnum"></span><span class="mstra-pmes" data-campo="mes"></span></div>
          <span class="mstra-pnota" data-campo="nota"></span>
          <a class="btn mstra-cta" href="#"></a>
        </div>
        <p class="mstra-tip"><span class="mstra-tip-ico" aria-hidden="true">💡</span><span data-campo="uso"></span></p>
      </div>
    </div>
  </dialog>

  <script>
  (function () {
    var dlg = document.getElementById('mstra-dlg');
    if (!dlg || typeof dlg.showModal !== 'function') return;  // sin <dialog>, los cuadros no abren nada
    var datos = [];
    try { datos = JSON.parse(document.getElementById('fichas-data').textContent); } catch (e) {}
    var caja = dlg.querySelector('.mstra-caja');
    var zonaCeldas = document.querySelector('.zz-wrap');
    var wa   = dlg.getAttribute('data-wa');
    var cta  = dlg.querySelector('.mstra-cta');
    var icoN = dlg.querySelector('.mstra-chip-ico');
    var mImg = dlg.querySelector('.mstra-media-img');
    var mNota = dlg.querySelector('.mstra-media-nota');
    var mVer = dlg.querySelector('.mstra-media-ver');
    var abridor = null;
    var lento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function set(campo, val) {
      var el = dlg.querySelector('[data-campo="' + campo + '"]');
      if (el) el.textContent = val || '';
    }
    function rect(el) { return el.getBoundingClientRect(); }

    function animar(desde, hacia, ida) {
      var dx = desde.left - hacia.left, dy = desde.top - hacia.top;
      var sx = Math.max(desde.width / hacia.width, 0.05);
      var sy = Math.max(desde.height / hacia.height, 0.05);
      var chico = { transformOrigin: 'top left', transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')', opacity: ida ? 0.35 : 0.15 };
      var grande = { transformOrigin: 'top left', transform: 'none', opacity: 1 };
      return caja.animate(ida ? [chico, grande] : [grande, chico],
        { duration: ida ? 300 : 230, easing: ida ? 'cubic-bezier(.2,.75,.25,1)' : 'cubic-bezier(.4,0,.9,.45)' });
    }

    function abrir(btn) {
      var f = datos[+btn.dataset.f];
      if (!f) return;
      abridor = btn;
      dlg.style.setProperty('--c', f.color);
      set('area', f.area); set('n', f.n); set('que', f.que); set('uso', f.uso);
      set('pnum', f.pnum); set('mes', f.mes); set('tag', f.tag); set('nota', f.nota);
      var bloque = dlg.querySelector('.mstra-precio-bloque');
      if (bloque) bloque.classList.toggle('es-plan', !!f.plan);
      if (cta) cta.textContent = f.cta || 'Pedir por WhatsApp →';
      if (icoN && window.Iconos) icoN.innerHTML = Iconos.html(f.ico);
      // muestra en vivo: si la ficha tiene demo, la portada llena el hueco
      if (f.demo) {
        mImg.src = f.demo.img; mImg.alt = f.demo.marca || ''; mImg.hidden = false;
        mNota.hidden = true;
        mVer.href = f.demo.arch; mVer.hidden = false;
        dlg.style.setProperty('--t', f.demo.tono);
      } else {
        mImg.hidden = true; mImg.removeAttribute('src');
        mNota.hidden = false; mVer.hidden = true;
      }
      if (cta) cta.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Hola LQS, me interesa: ' + f.n + '.');
      var desde = rect(btn);
      dlg.showModal();
      if (!lento) animar(desde, rect(caja), true);
    }

    function cerrar() {
      if (lento || !abridor) { dlg.close(); return; }
      var a = animar(rect(abridor), rect(caja), false);
      a.onfinish = function () { dlg.close(); };
    }

    if (zonaCeldas) zonaCeldas.addEventListener('click', function (e) {
      var b = e.target.closest('.zz-cel');
      if (b) abrir(b);                               // la muestra crece desde su celda
    });
    dlg.querySelector('.mstra-x').addEventListener('click', cerrar);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) cerrar(); });   // clic fuera
    dlg.addEventListener('cancel', function (e) { e.preventDefault(); cerrar(); });    // Esc
  })();
  </script>

  <script>
  /* Muestras: coverflow 3D de áreas + despliegue en zigzag.
     - Paseo: las cartas de área giran en perspectiva; la central va al frente.
     - Tocar la carta central despliega su reja en zigzag; tocar una de los lados
       la trae al centro. «← Áreas» vuelve al coverflow.
     - Sin JS: fila deslizable y legible (lo resuelve el CSS). */
  (function () {
    var cf = document.querySelector('.cf');
    if (!cf) return;
    var escena  = cf.querySelector('.cf-escena');
    var cards   = [].slice.call(cf.querySelectorAll('.cf-card'));
    var puntos  = [].slice.call(cf.querySelectorAll('.cf-punto'));
    var paneles = [].slice.call(document.querySelectorAll('.zz'));
    var n = cards.length;
    if (!n) return;
    var lento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var activo = Math.floor(n / 2), timer = null, desplegado = false;   // arranca centrado (abanico simétrico)

    cf.classList.add('cf-3d');                 // enciende el posicionamiento 3D
    paneles.forEach(function (p) { p.hidden = true; });

    function pintar() {
      cards.forEach(function (c, i) {
        var d = i - activo, ad = Math.abs(d), vis = ad <= 3;
        c.style.display = vis ? '' : 'none';
        c.style.opacity = ad === 0 ? 1 : (ad === 1 ? 0.92 : (ad === 2 ? 0.6 : 0.32));
        c.style.zIndex  = 100 - ad;
        c.style.transform =
          'translate(-50%,-50%) translateX(' + (d * 58) + '%)' +
          ' translateZ(' + (-ad * 86) + 'px) rotateY(' + (d * -42) + 'deg)' +
          ' scale(' + (d === 0 ? 1 : 0.94) + ')';
        c.classList.toggle('cf-activa', d === 0);
        c.setAttribute('aria-hidden', vis ? 'false' : 'true');
        c.tabIndex = d === 0 ? 0 : -1;
      });
      puntos.forEach(function (p, i) { p.classList.toggle('cf-act', i === activo); });
    }
    function ir(i) { activo = (i % n + n) % n; pintar(); }

    function parar() { if (timer) { clearInterval(timer); timer = null; } }
    function auto() {
      if (lento) return;
      parar();
      timer = setInterval(function () {
        if (!desplegado && !cf.matches(':hover')) ir(activo + 1);
      }, 3200);
    }

    function desplegar(idx) {
      var panel = paneles[idx];
      if (!panel) return;
      parar();
      desplegado = true;
      cf.setAttribute('hidden', '');
      paneles.forEach(function (p) { p.hidden = (p !== panel); });
      requestAnimationFrame(function () { panel.classList.add('zz-on'); });
      setTimeout(function () { panel.classList.add('zz-on'); }, 90);   // respaldo si rAF está en pausa
      var y = panel.getBoundingClientRect().top + window.pageYOffset - 84;
      window.scrollTo({ top: y, behavior: lento ? 'auto' : 'smooth' });
    }
    function recoger() {
      desplegado = false;
      paneles.forEach(function (p) { p.classList.remove('zz-on'); p.hidden = true; });
      cf.removeAttribute('hidden');
      pintar();
      auto();
      var y = cf.getBoundingClientRect().top + window.pageYOffset - 84;
      window.scrollTo({ top: y, behavior: lento ? 'auto' : 'smooth' });
    }

    cards.forEach(function (c, i) {
      c.addEventListener('click', function () {
        if (i === activo) desplegar(+c.dataset.area); else ir(i);
      });
    });
    puntos.forEach(function (p) {
      p.addEventListener('click', function () { ir(+p.dataset.ir); });
    });
    var prev = cf.querySelector('.cf-prev'), next = cf.querySelector('.cf-next');
    if (prev) prev.addEventListener('click', function () { ir(activo - 1); });
    if (next) next.addEventListener('click', function () { ir(activo + 1); });
    paneles.forEach(function (p) {
      var v = p.querySelector('.zz-volver');
      if (v) v.addEventListener('click', recoger);
    });
    escena.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') ir(activo - 1);
      else if (e.key === 'ArrowRight') ir(activo + 1);
    });

    pintar();
    auto();
  })();
  </script>
</section>
