<!-- ============ CALCULADORA · NIVELES POR ÁREA ============ -->
<section class="seccion" id="cotiza">
  <div class="niv-areas">{{NIVELES}}</div>

  <aside class="niv-tot" id="niv-tot" aria-live="polite">
    <div class="niv-tot-l">
      <span class="niv-tot-lab">Tu estimado</span>
      <p class="niv-resumen" id="niv-resumen">Aún no has elegido nada.</p>
    </div>
    <div class="niv-tot-cifras">
      <div class="niv-cifra" id="niv-inicial" hidden><span>Inversión inicial</span><b id="niv-inicial-v">$0</b></div>
      <div class="niv-cifra" id="niv-mensual" hidden><span>Mensualidad</span><b id="niv-mensual-v">$0</b></div>
      <div class="niv-cifra" id="niv-descf" hidden><span id="niv-desc-n">Descuento</span><b id="niv-desc-v">0%</b></div>
    </div>
    <div class="niv-tot-cta">
      <a class="btn claro" id="niv-wa" href="#" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn ghost claro" id="niv-correo" href="#">Correo</a>
    </div>
    <p class="niv-razon mono" id="niv-razon">Es un estimado sobre tarifas «desde». El número final sale de una conversación corta.</p>
  </aside>

  <script>
  /* Calculadora de niveles: un nivel por área, el total se arma con descuento
     por nº de áreas (la misma escalera del tarifario, que llega como JSON). Es
     autónoma: no toca el guion compartido. */
  (function () {
    var sec = document.getElementById('cotiza'); if (!sec) return;
    var escN = document.getElementById('niv-esc');
    var esc = []; try { esc = JSON.parse((escN && escN.textContent) || '[]'); } catch (e) {}
    var cards = [].slice.call(sec.querySelectorAll('.niv-card'));
    if (!cards.length) return;
    var sel = {};                                   // área -> tarjeta elegida
    var wa = '{{WHATSAPP}}', correo = '{{CORREO}}';
    var fmt = function (n) { return '$' + Math.round(n).toLocaleString('es-CO'); };
    function pct(k) { var p = 0; esc.forEach(function (e) { if (k >= e[0]) p = e[1]; }); return p; }
    function sig(k) { for (var i = 0; i < esc.length; i++) if (esc[i][0] > k) return esc[i]; return null; }

    var E = {
      tot: document.getElementById('niv-tot'),
      resumen: document.getElementById('niv-resumen'),
      inicial: document.getElementById('niv-inicial'), inicialV: document.getElementById('niv-inicial-v'),
      mensual: document.getElementById('niv-mensual'), mensualV: document.getElementById('niv-mensual-v'),
      descf: document.getElementById('niv-descf'), descN: document.getElementById('niv-desc-n'), descV: document.getElementById('niv-desc-v'),
      razon: document.getElementById('niv-razon'),
      wa: document.getElementById('niv-wa'), correo: document.getElementById('niv-correo')
    };

    function calc() {
      var areas = Object.keys(sel), u = 0, m = 0, lineas = [];
      areas.forEach(function (a) {
        var c = sel[a];
        u += +c.dataset.u; m += +c.dataset.m;
        lineas.push({ nom: c.dataset.nom, tn: c.dataset.tnom, u: +c.dataset.u, m: +c.dataset.m });
      });
      var p = pct(areas.length), inicial = u * (1 - p / 100);
      E.tot.classList.toggle('niv-tot-on', areas.length > 0);

      E.resumen.innerHTML = areas.length
        ? lineas.map(function (l) { return '<span class="niv-rline"><b>' + l.nom + '</b> · ' + l.tn + '</span>'; }).join('')
        : 'Aún no has elegido nada.';

      E.inicial.hidden = !(inicial > 0);
      E.inicialV.textContent = fmt(inicial);
      E.mensual.hidden = !(m > 0);
      E.mensualV.textContent = fmt(m) + '/mes';
      E.descf.hidden = !(p > 0);
      E.descN.textContent = p > 0 ? ('Descuento · ' + areas.length + ' áreas') : '';
      E.descV.textContent = '−' + p + '%';

      var s = sig(areas.length), r;
      if (!areas.length) r = 'Es un estimado sobre tarifas «desde». El número final sale de una conversación corta.';
      else if (s) r = 'Suma otra área y el descuento sube a −' + s[1] + '% (' + s[0] + ' áreas).';
      else r = 'Ya tienes el máximo descuento. El número final sale de una conversación corta.';
      E.razon.textContent = r;

      var t = ['Hola LQS, quiero cotizar.', ''];
      if (lineas.length) {
        t.push('Lo que elegí:');
        lineas.forEach(function (l) {
          var pz = l.nom + ' · ' + l.tn + ' — ';
          pz += (l.u && l.m) ? (fmt(l.u) + ' + ' + fmt(l.m) + '/mes') : (l.u ? fmt(l.u) : fmt(l.m) + '/mes');
          t.push('- ' + pz);
        });
        t.push('');
        if (inicial > 0) t.push('Inversión inicial: ' + fmt(inicial) + (p > 0 ? ' (−' + p + '% por ' + areas.length + ' áreas)' : ''));
        if (m > 0) t.push('Mensualidad: ' + fmt(m));
      } else { t.push('Todavía estoy mirando los niveles.'); }
      var msg = t.join('\n');
      E.wa.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(msg);
      E.correo.href = 'mailto:' + correo + '?subject=' + encodeURIComponent('Cotización LQS') + '&body=' + encodeURIComponent(msg);
    }

    cards.forEach(function (c) {
      c.addEventListener('click', function () {
        var a = c.dataset.area, era = sel[a];
        [].forEach.call(c.parentNode.children, function (x) { x.setAttribute('aria-pressed', 'false'); });
        if (era === c) { delete sel[a]; }            // volver a tocar el mismo = quitar
        else { sel[a] = c; c.setAttribute('aria-pressed', 'true'); }
        calc();
      });
    });
    calc();
  })();
  </script>
</section>
