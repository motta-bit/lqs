<!-- ============ 10 CONTACTO ============ -->
<section class="seccion" id="contacto">
  <div class="eyebrow">O escríbenos directo</div>
  <h2 style="margin-bottom:8px">Hablemos</h2>
  <p class="dim" style="max-width:56ch;margin-bottom:20px">Lo que escribas sale directo a nuestro
    WhatsApp o a nuestro correo. No hay formulario esperando a que alguien lo revise.</p>
  <div class="pared">
    <form class="form form-ancho" id="form">
      <div>
        <label for="f-nombre">Nombre</label>
        <input type="text" id="f-nombre" name="nombre" required>
      </div>
      <div>
        <label for="f-correo">Correo o WhatsApp</label>
        <input type="text" id="f-correo" name="correo" required>
      </div>
      <div>
        <label for="f-msg">Qué necesitas</label>
        <textarea id="f-msg" name="mensaje" required></textarea>
      </div>
      <label class="legal" style="text-transform:none;letter-spacing:0;font-size:12px;font-family:inherit">
        <input type="checkbox" id="f-legal" required>
        <span>Autorizo el tratamiento de mis datos conforme a la <a href="legal.html#datos" target="_blank" rel="noopener">política de tratamiento</a> y a la Ley 1581 de 2012.</span>
      </label>
      <div class="form-acc">
        <a class="btn v" id="env-wa" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
        <a class="btn ghost" id="env-correo" href="#">Enviar por correo</a>
      </div>
      <p class="dim" style="font-size:12px" id="form-estado" role="status"></p>
    </form>

  </div>
</section>
