<!-- ============ GALERÍA ============ -->
<section class="seccion" id="galeria">
  <div class="gal-barra">
    <div class="buscador">
      <span class="busca-ico" aria-hidden="true">⌕</span>
      <input type="search" id="busca" placeholder="Busca lo que necesitas: empaque, reel, menú, evento…"
             aria-label="Buscar en las muestras" autocomplete="off">
      <button class="busca-x" type="button" id="busca-x" aria-label="Limpiar búsqueda" hidden>×</button>
    </div>
    <div class="chips" id="gal-chips"></div>
  </div>

  <p class="mono gal-cuenta" id="gal-cuenta" role="status"></p>

  <div class="pared" id="gal-rejilla"></div>

  <div class="gal-nada" id="gal-nada" hidden>
    <h3>No encontramos nada con eso</h3>
    <p class="dim">Puede que no esté en la galería todavía y sí lo hagamos. Pregúntanos directo
      y te decimos de una.</p>
    <a class="btn ghost sm" id="gal-preguntar" href="#">Preguntar por WhatsApp</a>
  </div>
</section>
