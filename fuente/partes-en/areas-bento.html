<!-- ============ AREAS BENTO (color) ============ -->
<section class="seccion" id="areas-bento">
  <div class="eyebrow">Eight fronts · one or all</div>
  <h2 style="margin-bottom:6px">What we can do for your ideas</h2>
  <p class="dim" style="margin:0 0 20px;max-width:58ch">Take the front you need today and add the rest when it makes
    sense. Each one works on its own and fits with the others.</p>
  {{AREABENTO}}
  <script>
  (function () {
    var rej = document.querySelector('#areas-bento .ab-rej');
    if (!rej) return;
    var lento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (lento || !('IntersectionObserver' in window)) { rej.classList.add('ab-entra'); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { rej.classList.add('ab-entra'); io.disconnect(); } });
    }, { threshold: 0.15 });
    io.observe(rej);
  })();
  </script>
</section>
