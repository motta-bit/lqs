<!-- ============ AREAS BENTO (color) ============ -->
<section class="seccion" id="areas-bento">
  <div class="eyebrow">Eight fronts · one DNA</div>
  <h2 style="margin-bottom:6px">Modular in its color too</h2>
  <p class="dim" style="margin:0 0 20px;max-width:58ch">Each area is its own world —with its color and its signal— and at the same
    time it fits with the rest. That's the brand: lilac at the base, and a rainbow of fronts you hire on their own or together.</p>
  {{AREABENTO}}
  <script>
  (function () {
    var rej = document.querySelector('#areas-bento .ab-rej');
    if (!rej) return;
    var lento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (lento || !('IntersectionObserver' in window)) { rej.classList.add('ab-entra'); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { rej.classList.add('ab-entra'); io.disconnect(); } });
    }, { threshold: 0.15 });
    io.observe(rej);
  })();
  </script>
</section>
