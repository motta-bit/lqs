<!-- ============ AREAS BENTO (color) ============ -->
<section class="seccion" id="areas-bento">
  <div class="eyebrow">Eight fronts · one or all</div>
  <h2 style="margin-bottom:6px">What we can do for your ideas</h2>
  <p class="dim" style="margin:0 0 20px;max-width:58ch">Take the front you need today and add the rest when it makes
    sense. Each one works on its own and fits with the others.</p>
  {{AREABENTO}}
  <script>
  /* Each cube appears as it enters the viewport, not all at once, with a soft stagger. */
  (function () {
    var rej = document.querySelector('#areas-bento .ab-rej');
    if (!rej) return;
    var tiles = [].slice.call(rej.querySelectorAll('.ab-tile'));
    var lento = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (lento || !('IntersectionObserver' in window)) {
      tiles.forEach(function (t) { t.classList.add('ab-visto'); }); return;
    }
    var io = new IntersectionObserver(function (es) {
      var k = 0;
      es.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.style.animationDelay = (k++ * 60) + 'ms';
          e.target.classList.add('ab-visto');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.2, rootMargin: '0px 0px -6% 0px' });
    tiles.forEach(function (t) { io.observe(t); });
  })();
  </script>
</section>
