<script>/*CARITA_JS*/</script>
<script>/*ICONOS_JS*/</script>
<script>
(function(){
"use strict";
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return [].slice.call((r||document).querySelectorAll(s)); };
var quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- datos ---------- */
var MODULOS = {{DATOS}};
var PRECIO = {}, ICONO = {}, MENSUAL = {};
MODULOS.forEach(function(m){ PRECIO[m.nombre]=m.precio; ICONO[m.nombre]=m.ico; MENSUAL[m.nombre]=!!m.mensual; });
var LOGO = {{LOGO}};

var PLAZOS = [
  {d:"5 días",  mult:1.50, nota:"recargo del 50% por urgencia", cara:0},
  {d:"10 días", mult:1.25, nota:"recargo del 25%",              cara:40},
  {d:"15 días", mult:1.00, nota:"sin recargo",                  cara:60},
  {d:"30 días", mult:0.95, nota:"5% menos por darnos aire",     cara:100}
];

/* ---------- íconos y logo ---------- */
Iconos.auto();
$("#logo-cara").innerHTML = LOGO;
$("#pie-cara").innerHTML  = LOGO;

/* ---------- caritas de interfaz ---------- */
var caraHero = new Carita($("#hero-cara"), {gesto:"contenta", seguir:true});
var caraCot  = new Carita($("#cot-cara"),  {gesto:"guino",    seguir:false});

/* ---------- 00 cabecera ---------- */
var top = $("#top");
addEventListener("scroll", function(){
  top.classList.toggle("pegada", scrollY > 100);
}, {passive:true});

/* ---------- 01 entrada armada ---------- */
if (!quieto) document.body.classList.add("arma");

/* ---------- chips de módulo ---------- */
var sel = new Set();
var filtro = "todos";

function chipHTML(txt, val, pressed){
  return '<button class="chip" type="button" data-v="'+val+'" aria-pressed="'+pressed+'">'+txt+'</button>';
}
$("#chips").innerHTML = chipHTML("Todos","todos",true) +
  MODULOS.map(function(m){ return chipHTML(m.nombre, m.nombre, false); }).join("");

$("#eco-chips").innerHTML = MODULOS.map(function(m){
  return chipHTML(m.nombre, m.nombre, false);
}).join("");

$$("#chips .chip").forEach(function(c){
  c.addEventListener("click", function(){
    filtro = c.dataset.v;
    $$("#chips .chip").forEach(function(o){ o.setAttribute("aria-pressed", o===c); });
    $$(".mod[data-name]").forEach(function(b){
      b.classList.toggle("oculto", filtro!=="todos" && b.dataset.name!==filtro);
    });
  });
});

$$("#eco-chips .chip").forEach(function(c){
  c.addEventListener("click", function(){ alternar(c.dataset.v); });
});

/* ---------- 03/04 selección de módulos ---------- */
function alternar(n){
  if (sel.has(n)) sel.delete(n); else sel.add(n);
  sincronizar();
  pintar();
}
function sincronizar(){
  $$(".mod[data-name]").forEach(function(b){ b.setAttribute("aria-pressed", sel.has(b.dataset.name)); });
  $$("#eco-chips .chip").forEach(function(c){ c.setAttribute("aria-pressed", sel.has(c.dataset.v)); });
}
$$(".mod[data-name]").forEach(function(b){
  b.setAttribute("aria-pressed","false");
  b.addEventListener("click", function(){ alternar(b.dataset.name); });
});
$("#limpiar").addEventListener("click", function(){ sel.clear(); sincronizar(); pintar(); });

/* ---------- descuentos reales del tarifario ---------- */
function descuento(arr, inicial){
  var n = arr.length, t = inicial, s = new Set(arr), op = [];
  if (n>=5 && t>=8000000)                                op.push({p:20, n:"Ultra completo"});
  if (s.has("Marca") && s.has("Web"))                    op.push({p:15, n:"Marca + Web"});
  if (s.has("Redes") && (s.has("Video")||s.has("Foto")) && n>=3) op.push({p:15, n:"Redes + producción"});
  if (n>=2 && t<=4000000)                                op.push({p:10, n:"Esencial"});
  if (!op.length) return {p:0, n:""};
  return op.sort(function(a,b){ return b.p-a.p; })[0];
}

var fmt = function(n){ return "$" + Math.round(n).toLocaleString("es-CO"); };

/* ---------- pintar todo lo que depende de la selección ---------- */
var estado = {inicial:0, mensual:0, desc:{p:0,n:""}, arr:[]};

function pintar(){
  var pared = $("#pared"), vacio = $("#vacio");
  $$(".eco-chip", pared).forEach(function(e){ e.remove(); });

  var arr = MODULOS.map(function(m){ return m.nombre; }).filter(function(n){ return sel.has(n); });
  vacio.hidden = arr.length > 0;
  pared.classList.toggle("conectada", arr.length >= 2);

  var inicial = 0, mensual = 0;
  arr.forEach(function(n){
    var p = PRECIO[n] || 0;
    var chip = document.createElement("div");
    chip.className = "eco-chip";
    chip.innerHTML = '<span style="font-family:Syne;font-weight:800;font-size:16px">'+n+'</span>' +
      '<span class="mono" style="font-size:10.5px;color:#4A4453">' +
      (MENSUAL[n] ? "desde "+fmt(p)+" /mes" : (p ? "desde "+fmt(p) : "por alcance")) + '</span>';
    pared.appendChild(chip);
    if (MENSUAL[n]) mensual += p; else inicial += p;
  });

  var d = descuento(arr, inicial);
  var porAlcance = arr.filter(function(n){ return !PRECIO[n]; });

  $("#n-mod").textContent = arr.length;
  $("#inicial").textContent = fmt(inicial * (1 - d.p/100));
  $("#mensual").textContent = fmt(mensual) + " /mes";
  $("#desc").textContent = d.p + "%";
  $("#desc-nombre").textContent = d.n || "Ahorro por conectar";
  $("#d-inicial").hidden = inicial === 0;
  $("#d-mensual").hidden = mensual === 0;
  $("#d-desc").hidden = d.p === 0;
  $("#aviso").hidden = mensual === 0;

  var alc = $("#alcance");
  alc.hidden = porAlcance.length === 0;
  if (porAlcance.length){
    alc.innerHTML = "<b>" + porAlcance.join(" y ") + (porAlcance.length>1?" se cotizan":" se cotiza") +
      " por alcance.</b> No entra" + (porAlcance.length>1?"n":"") +
      " en las cifras de arriba — sale de la conversación.";
  }

  var arranque = sel.has("Redes") && sel.has("Marca");
  var r = $("#razon");
  if (arranque){
    r.innerHTML = "El descuento aplica al trabajo inicial, no a la mensualidad. Y como ya hay módulo Marca, " +
      "el <b>arranque de Redes ($290.000) no se cobra</b>: las plantillas ya existen.";
  } else if (d.p){
    r.textContent = "Un brief, un interlocutor, activos que se reutilizan. Por eso baja, no por rebaja." +
      (mensual ? " El descuento aplica al trabajo inicial, no a la mensualidad." : "");
  } else {
    r.textContent = "Elegí dos o más para que los bloques compartan pared.";
  }

  estado = {inicial:inicial, mensual:mensual, desc:d, arr:arr};
  cotizar();
}

/* ---------- 09 cotizador ---------- */
var escala = "emprendedor", plazo = 2;

$$("#seg-escala button").forEach(function(b){
  b.addEventListener("click", function(){
    escala = b.dataset.v;
    $$("#seg-escala button").forEach(function(o){ o.setAttribute("aria-pressed", o===b); });
    cotizar();
  });
});

var urg = $("#urg");
urg.addEventListener("input", function(){ plazo = +urg.value; cotizar(); });

function cotizar(){
  var P = PLAZOS[plazo];
  $("#urg-val").textContent = P.d + " · " + P.nota;
  caraCot.valor(P.cara);

  var res = $("#cot-resumen");
  if (!estado.arr.length){
    res.innerHTML = 'Todavía no elegiste módulos. Subí a <a href="#ecosistema" style="color:var(--p-lima)">armá tu ecosistema</a> y tocá los que te sirven.';
  } else {
    res.innerHTML = '<b>' + estado.arr.join(" · ") + '</b>' +
      (estado.desc.p ? ' <span class="mono" style="opacity:.7">— ' + estado.desc.n + ', −' + estado.desc.p + '%</span>' : '');
  }

  var inicial = estado.inicial * (1 - estado.desc.p/100) * P.mult;
  $("#c-inicial-v").textContent = fmt(inicial);
  $("#c-mensual-v").textContent = fmt(estado.mensual) + " /mes";
  $("#c-mensual").hidden = estado.mensual === 0;
  $("#c-inicial").hidden = estado.inicial === 0;

  var razon = "Es un estimado sobre tarifas «desde». El número final sale de una conversación de 20 minutos.";
  if (P.mult > 1) razon = "El plazo de " + P.d + " lleva " + P.nota + ". " + razon;
  if (estado.mensual) razon += " La mensualidad de Redes va aparte y no se suma al proyecto.";
  $("#c-razon").textContent = razon;

  var texto = "Hola LQS. Quiero cotizar";
  texto += estado.arr.length ? ": " + estado.arr.join(", ") + "." : " un proyecto.";
  texto += " Escala: " + escala + ". Lo necesito en " + P.d + ".";
  if (estado.inicial) texto += " El estimado del sitio me dio " + fmt(inicial) + " de inversión inicial";
  if (estado.mensual) texto += (estado.inicial ? " y " : " El estimado del sitio me dio ") + fmt(estado.mensual) + " al mes de Redes";
  if (estado.inicial || estado.mensual) texto += ".";
  $("#wa").href = "https://wa.me/573247680413?text=" + encodeURIComponent(texto);
}

/* ---------- 06 chips de módulo del caso ---------- */
$("#caso-mods").innerHTML = ["Marca","Redes","Web","Automatización"].map(function(n){
  return '<span class="mchip"><span class="ico" data-ico="'+(ICONO[n]||"")+'"></span>'+n+'</span>';
}).join("");
Iconos.auto($("#caso-mods"));

/* ---------- 05 antes / después ---------- */
(function(){
  var ad = $("#ad"), manija = $("#ad-manija"), panel = $("#ad-despues");
  var v = 50, arrastrando = false;
  function poner(x){
    v = Math.max(0, Math.min(100, x));
    manija.style.left = v + "%";
    panel.style.clipPath = "inset(0 0 0 " + v + "%)";
    ad.setAttribute("aria-valuenow", Math.round(v));
  }
  function desdeEvento(e){
    var r = ad.getBoundingClientRect();
    poner(((e.clientX - r.left) / r.width) * 100);
  }
  ad.addEventListener("pointerdown", function(e){
    arrastrando = true; ad.setPointerCapture(e.pointerId); desdeEvento(e);
  });
  ad.addEventListener("pointermove", function(e){ if (arrastrando) desdeEvento(e); });
  ad.addEventListener("pointerup",   function(){ arrastrando = false; });
  ad.addEventListener("pointercancel", function(){ arrastrando = false; });
  ad.addEventListener("keydown", function(e){
    if (e.key === "ArrowLeft")  { poner(v - 4); e.preventDefault(); }
    if (e.key === "ArrowRight") { poner(v + 4); e.preventDefault(); }
    if (e.key === "Home")       { poner(0);  e.preventDefault(); }
    if (e.key === "End")        { poner(100); e.preventDefault(); }
  });
  poner(50);
})();

/* ---------- 10 formulario ---------- */
$("#form").addEventListener("submit", function(e){
  e.preventDefault();
  var f = e.target;
  var texto = "Hola LQS, soy " + f.nombre.value + " (" + f.correo.value + "). " + f.mensaje.value;
  $("#form-estado").innerHTML = 'Este formulario todavía no tiene servidor. ' +
    '<a href="https://wa.me/573247680413?text=' + encodeURIComponent(texto) +
    '" target="_blank" rel="noopener" style="color:var(--violeta)"><b>Mandalo por WhatsApp</b></a> ' +
    'y te contestamos hoy.';
});

/* ---------- arranque ---------- */
/* dos módulos elegidos de entrada: la pieza central tiene que explicarse sola */
sel.add("Marca"); sel.add("Web");
sincronizar();
pintar();
})();
</script>
